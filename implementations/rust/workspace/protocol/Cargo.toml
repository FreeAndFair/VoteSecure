[package]
name = "votesecure-protocol-library"
version = "0.3.0"
license = "Apache-2.0"
edition = "2024"

[dependencies]
cryptography = { path = "../cryptography" }
vser_derive = { path = "../cryptography/macros/vser_derive" }
custom_warning_macro = { path = "../macros/custom_warning_macro" }
enum_dispatch = "0.3.13"
ascent = "0.8"
rand = "0.10.1"
strum = { version = "0.26", features = ["derive"] }
sha3 = "0.10"
hex = "0.4"
# generic-array version needs to be pinned, newer versions break SW supply chain checks
generic-array = "=0.14.7"

[dev-dependencies]
stateright = "0.31.0"

[features]
custom-warnings = ["cryptography/custom-warnings"]
