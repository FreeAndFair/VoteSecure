# .github/workflows/verify-needham-schroeder.yml
# Author: Joe Kiniry, Daniel M. Zimmerman
# Created: 2026-07-16

# CV for the Needham-Schroeder pedagogical example: runs `make cv`, which runs
# the actual formal analyses -- Clafer inhabitance (Chocosolver), Tamarin
# proofs (`--prove`), and ProVerif -- and records outputs under
# examples/needham-schroeder/output/.
#
# This example intentionally includes an INSECURE protocol variant alongside
# the fixed one, so "all properties hold" is NOT the pass criterion: CV runs
# the tools and records results, failing only on tool/execution errors.
#
# Runs automatically after the corresponding CI workflow succeeds on `main`
# (set the repo variable SLOW_CV_TEST_BRANCH to a branch name to test before
# merge), and on manual dispatch.
#
# NOTE: ProVerif has no bundled Docker image, so proverif-cv is skipped with a
# warning here; Tamarin runs in the CPV image and Chocosolver in the PLE image.

name: Verify Needham-Schroeder Example

on:
  workflow_run:
    workflows:
      - Test Validity of Needham-Schroeder Example
    types:
      - completed

  workflow_dispatch:
    inputs:
      timeout:
        description: 'Timeout for the CV run'
        required: false
        default: '60m'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  TIMEOUT: ${{ github.event.inputs.timeout || '60m' }}

jobs:
  cv:
    name: Run `make cv` for the Needham-Schroeder Example
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == vars.SLOW_CV_TEST_BRANCH))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_READ_ONLY_TOKEN_USERNAME }}
          password: ${{ secrets.DOCKER_READ_ONLY_TOKEN }}

      - name: Pull Docker Images
        run: |
          docker pull freeandfair/de-ple-e2eviv:latest
          docker pull freeandfair/cpv-e2eviv:latest

      - name: Run `make cv`
        working-directory: examples/needham-schroeder
        run: USE_DOCKER=yes timeout $TIMEOUT make cv

      - name: Save the Generated CV Outputs
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: needham-schroeder-cv-output
          path: examples/needham-schroeder/output/*
